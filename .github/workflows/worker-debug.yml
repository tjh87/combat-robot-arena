name: Tournament worker diagnostics
on:
  push:
    branches: [mode-builder-review]
    paths: ['.github/workflows/worker-debug.yml', 'tests/tournament-debug-browser.mjs']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REDIS_URL: ${{ secrets.ONLINE_REDIS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - run: node tests/build-mode-fixture.mjs
      - run: |
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          node --import tsx server/test-site.ts > /tmp/worker-debug.log 2>&1 &
          sleep 2
          node tests/tournament-debug-browser.mjs
