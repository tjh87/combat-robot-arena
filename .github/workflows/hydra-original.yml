name: Restore original Hydra mobility
on:
  push:
    branches: [hydra-original-mobility]
    paths: ['.github/workflows/hydra-original.yml','scripts/hydra-original-drive.mjs','tests/hydra-mobility-*']
permissions:
  contents: write
concurrency:
  group: hydra-original-mobility
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Measure the original pre-redesign source
        run: |
          mkdir -p browser-evidence
          git worktree add "$RUNNER_TEMP/hydra-original" 95c86dc6c8a6dcf213175d000c2de7a81221e224
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/hydra-original/node_modules"
          cp tests/hydra-mobility-benchmark.ts "$RUNNER_TEMP/hydra-original/tests/hydra-mobility-benchmark.ts"
          cd "$RUNNER_TEMP/hydra-original"
          HYDRA_METRICS="$GITHUB_WORKSPACE/browser-evidence/original-mobility.json" node --import tsx tests/hydra-mobility-benchmark.ts > "$GITHUB_WORKSPACE/browser-evidence/original.log" 2>&1
      - name: Measure the current release
        run: HYDRA_METRICS=browser-evidence/prior-mobility.json node --import tsx tests/hydra-mobility-benchmark.ts > browser-evidence/prior.log 2>&1
      - name: Restore original drive geometry and control
        run: node scripts/hydra-original-drive.mjs
      - name: Build, offline assets, and original mobility acceptance
        run: |
          node scripts/build.mjs
          node scripts/verify.mjs
          node --import tsx tests/hydra-mobility-benchmark.ts > browser-evidence/restored.log 2>&1
          node --import tsx tests/hydra-mobility-acceptance.ts
          node --import tsx tests/hydra-approved.ts
          node --import tsx tests/roster.ts > browser-evidence/roster.log 2>&1
      - name: Browser dependencies outside game
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Save, reload, practice, and WebGL
        run: |
          node scripts/serve.mjs > browser-evidence/server.log 2>&1 &
          node tests/hydra-browser.mjs
      - name: Update Hydra game estimates
        run: |
          node --import tsx --input-type=module -e "import fs from 'node:fs';import{preset,compile,wheelBase,wheelCentreZ}from'./src/model.ts';const path='handover/ROBOT_SPECIFICATIONS.json',data=JSON.parse(fs.readFileSync(path,'utf8')),c=preset(2),b=compile(c),r=data.robots.find(r=>r.profile==='hydra');Object.assign(r,{drive:c.drive,chassis:c.chassis,totalMassKg:b.mass,wheelBaseM:wheelBase(c),wheelCenterZM:wheelCentreZ(c)});fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydra-original-mobility-evidence
          path: browser-evidence
      - name: Commit tested source to feature branch
        run: |
          rm scripts/hydra-original-drive.mjs .github/workflows/hydra-original.yml
          git status --short
          git diff --check
          git diff src/model.ts src/sim.ts tests/hydra-browser.mjs handover/ROBOT_SPECIFICATIONS.json
          git log --oneline -10
          git add src/model.ts src/sim.ts tests/hydra-browser.mjs tests/hydra-mobility-benchmark.ts tests/hydra-mobility-acceptance.ts handover/ROBOT_SPECIFICATIONS.json scripts/hydra-original-drive.mjs .github/workflows/hydra-original.yml
          git -c user.name='tjh87' -c user.email='tjh87@users.noreply.github.com' commit -m 'Restore Hydra original wheels, gearing, and direct mobility'
          git push origin HEAD:hydra-original-mobility
