name: Hydra custom build compatibility
on:
  push:
    branches: [hydra-approved-redesign]
    paths: ['.github/workflows/hydra-custom.yml','scripts/hydra-custom-fit.mjs']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve the tested default geometry
        run: |
          mkdir -p browser-evidence
          node --import tsx --input-type=module -e "import fs from 'node:fs';import{preset,compile}from'./src/model.ts';fs.writeFileSync('browser-evidence/before-default.json',JSON.stringify(compile(preset(2)).parts));"
          node scripts/hydra-custom-fit.mjs
      - name: Build, offline assets, and custom mass behavior
        run: |
          node scripts/build.mjs
          node scripts/verify.mjs
          node --import tsx tests/hydra-custom.ts
          node --import tsx tests/hydra-approved.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydra-custom-evidence
          path: browser-evidence
      - name: Commit tested source
        run: |
          rm scripts/hydra-custom-fit.mjs .github/workflows/hydra-custom.yml
          git status --short
          git diff --check
          git diff src/hydra-geometry.ts
          git log --oneline -10
          git add src/hydra-geometry.ts tests/hydra-custom.ts scripts/hydra-custom-fit.mjs .github/workflows/hydra-custom.yml
          git -c user.name='tjh87' -c user.email='tjh87@users.noreply.github.com' commit -m 'Preserve custom Hydra tine mass and material settings'
          git push origin HEAD:hydra-approved-redesign
