name: Online first-hit recovery
on:
  push:
    branches: [online-hit-recovery]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDIS_URL: ${{ secrets.ONLINE_REDIS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reproduce real impacts through the frame and checkpoint paths
        run: |
          node --import tsx tests/online-hit-probe.ts
          node --import tsx tests/online-prediction-probe.ts
      - name: Build the real browser impact probe
        run: |
          node scripts/build.mjs
          npm run online:build
          node scripts/online-hit-fixture.mjs
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Replay real impact frames through the online controller and renderer
        run: |
          node --import tsx server/test-site.ts > /tmp/online-hit-server.log 2>&1 &
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:4173/api/online > /dev/null; then break; fi; sleep 1; done
          node tests/online-hit-browser-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-hit-evidence
          path: browser-evidence
