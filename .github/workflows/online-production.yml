name: Production direct tournament fight acceptance
on:
  push:
    branches: [online-deployed-checks]
    paths: ['.github/workflows/online-production.yml']
permissions:
  contents: read
env:
  TESTED_SOURCE: 295c5111e3345f2f6eeef7315095f7c5dbf9d390
  ARENA_URL: https://bbots-tjh87.vercel.app/
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 295c5111e3345f2f6eeef7315095f7c5dbf9d390
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated browser
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Enter the physical tournament fight without a countdown
        run: node tests/tournament-direct-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-tournament-direct-evidence
          path: browser-evidence
