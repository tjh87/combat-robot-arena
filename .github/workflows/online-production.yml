name: Production online browser check
on:
  push:
    branches: [online-deployed-checks]
    paths: ['.github/workflows/online-production.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser tools outside the game
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Use the public production URL with native WebSockets
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          let source=readFileSync('tests/online-browser.mjs','utf8');
          source=source.replace("'http://127.0.0.1:4173/'","'https://bbots-tjh87.vercel.app/'");
          source=source.replaceAll('source:process.env.GITHUB_SHA',"source:'835f9da2557aefb38b8f47b4855a387498b7110c'");
          source=source.replace("name+'.png',timeout:30000","name+'.png',timeout:90000");
          source=source.replace('},240000);','},360000);');
          writeFileSync(process.env.RUNNER_TEMP+'/browser/production-check.mjs',source);
          NODE
          timeout 420s node "$RUNNER_TEMP/browser/production-check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-production-evidence
          path: browser-evidence
