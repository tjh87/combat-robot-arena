name: Deployed online browser check
on:
  push:
    branches: [online-deployed-checks]
    paths: ['.github/workflows/online-deployed.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONLINE_BASE_URL: https://combat-robot-arena-live-43c1shjkw-tjh87s-projects.vercel.app/
      ONLINE_DEPLOYED_SHA: 7c4fe335368d136aeefb44fdcbedeed25b37daa7
      ONLINE_PREVIEW_OIDC: ${{ secrets.ONLINE_PREVIEW_OIDC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser tools outside the game
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Create the origin-scoped preview harness
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const url=new URL(process.env.ONLINE_BASE_URL);
          if(url.protocol!=='https:'||!url.hostname.startsWith('combat-robot-arena-live-')||!url.hostname.endsWith('-tjh87s-projects.vercel.app'))throw Error('The preview target is invalid.');
          if(!process.env.ONLINE_PREVIEW_OIDC)throw Error('The preview credential is unavailable.');
          let source=readFileSync('tests/online-browser.mjs','utf8');
          source=source.replace("browser.newContext({viewport:","browser.newContext({extraHTTPHeaders:{'x-vercel-trusted-oidc-idp-token':process.env.ONLINE_PREVIEW_OIDC},viewport:");
          source=source.replace("'http://127.0.0.1:4173/'","process.env.ONLINE_BASE_URL");
          source=source.replaceAll('source:process.env.GITHUB_SHA','source:process.env.ONLINE_DEPLOYED_SHA');
          writeFileSync(process.env.RUNNER_TEMP+'/browser/deployed-check.mjs',source);
          NODE
      - name: Real Vercel rooms, player controls, POV, and refresh
        run: timeout 300s node "$RUNNER_TEMP/browser/deployed-check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-deployed-evidence
          path: browser-evidence
