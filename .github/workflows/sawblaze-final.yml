name: SawBlaze final validation
on:
  push:
    branches: [sawblaze-final-polish]
permissions:
  contents: write
concurrency:
  group: sawblaze-final
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Make sure that main matches the reviewed source
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = 39f859505b8522a9634ea76cc90614a17c2f2950
      - run: npm ci --no-audit --no-fund
      - name: Record historical blade-suite failures
        run: |
          rm -f docs/blades-update-results.json
          node --import tsx tests/blades-update.ts || BASELINE_EXIT=$?
          cp docs/blades-update-results.json "$RUNNER_TEMP/blades-before.json"
      - run: node scripts/finalize-sawblaze-metadata.mjs
      - name: Build and offline checks
        run: |
          node scripts/build.mjs
          node scripts/verify.mjs
      - name: Physics and rendering gates
        run: |
          node --import tsx tests/sawblaze-assembly.ts
          node --import tsx tests/sawblaze-svg.ts
          node --import tsx tests/roster.ts
          node --import tsx tests/visuals.ts
          rm -f docs/blades-update-results.json
          node --import tsx tests/blades-update.ts || BLADE_EXIT=$?
          node scripts/compare-blade-regressions.mjs "$RUNNER_TEMP/blades-before.json" docs/blades-update-results.json
      - name: Prepare cloud Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2 --no-audit --no-fund
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser and shader checks
        run: |
          node scripts/serve.mjs --port=4173 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node tests/sawblaze-browser.mjs
      - name: Save the tested branch
        run: |
          git status --short
          git diff --check
          git diff -- src handover/ROBOT_SPECIFICATIONS.json
          git log --oneline -10
          git rm scripts/finalize-sawblaze-metadata.mjs scripts/compare-blade-regressions.mjs .github/workflows/sawblaze-final.yml
          git add src handover/ROBOT_SPECIFICATIONS.json
          git -c user.name=tjh87 -c user.email=2867835+tjh87@users.noreply.github.com commit -m "Finish SawBlaze curved shell and SVG-based game specifications"
          git push origin HEAD:sawblaze-final-polish
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sawblaze-final-evidence
          path: |
            browser-evidence/
            docs/roster-results.json
            docs/blades-update-results.json
          retention-days: 7
