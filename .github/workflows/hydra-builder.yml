name: Hydra builder compatibility
on:
  push:
    branches: [hydra-approved-redesign]
    paths: ['.github/workflows/hydra-builder.yml','scripts/hydra-builder-fit.mjs']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align the builder inputs
        run: |
          mkdir -p browser-evidence
          node scripts/hydra-builder-fit.mjs
          node scripts/build.mjs
          node scripts/verify.mjs
      - name: Browser dependencies outside game
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser inputs, save, reload, and WebGL
        run: |
          node scripts/serve.mjs > browser-evidence/server.log 2>&1 &
          node tests/hydra-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydra-builder-evidence
          path: browser-evidence
      - name: Commit tested builder source
        run: |
          rm scripts/hydra-builder-fit.mjs .github/workflows/hydra-builder.yml
          git status --short
          git diff --check
          git diff src/main.ts tests/hydra-browser.mjs
          git log --oneline -10
          git add src/main.ts tests/hydra-browser.mjs scripts/hydra-builder-fit.mjs .github/workflows/hydra-builder.yml
          git -c user.name='tjh87' -c user.email='tjh87@users.noreply.github.com' commit -m 'Align Hydra builder dimensions and saved-build checks'
          git push origin HEAD:hydra-approved-redesign
