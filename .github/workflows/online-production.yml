name: Production tournament presentation acceptance
on:
  push:
    branches: [online-deployed-checks]
    paths: ['.github/workflows/online-production.yml']
permissions:
  contents: read
env:
  TESTED_SOURCE: b5eb11e61a3ff37bd1dcfb60b53948a7ad9c4bb4
  ARENA_URL: https://bbots-tjh87.vercel.app/
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5eb11e61a3ff37bd1dcfb60b53948a7ad9c4bb4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated browser
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Tournament portrait, records, bracket, and direct physical entry
        run: node tests/tournament-presentation-browser.mjs
      - name: Native online bracket, close controls, and physical frame
        run: node tests/tournament-online-presentation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-tournament-presentation-evidence
          path: browser-evidence
