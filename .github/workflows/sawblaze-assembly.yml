name: Approved SawBlaze assembly
on:
  push:
    branches: [sawblaze-approved-assembly]
permissions:
  contents: write
concurrency:
  group: sawblaze-assembly
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Make sure that main matches the reviewed source
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = e7c3969a90092bf4241fda5fdd3807aa63528b02
      - run: npm ci --no-audit --no-fund
      - name: Record historical blade-suite failures
        run: |
          rm -f docs/blades-update-results.json
          node --import tsx tests/blades-update.ts || BASELINE_EXIT=$?
          test -f docs/blades-update-results.json
          cp docs/blades-update-results.json "$RUNNER_TEMP/blades-before.json"
      - run: node scripts/apply-sawblaze-assembly.mjs
      - name: Build and verify the offline package
        run: |
          node scripts/build.mjs
          node scripts/verify.mjs
      - name: Assembly, motion and physics checks
        run: |
          node --import tsx tests/sawblaze-assembly.ts
          node --import tsx tests/sawblaze-svg.ts
          node --import tsx tests/roster.ts
          node --import tsx tests/visuals.ts
          rm -f docs/blades-update-results.json
          node --import tsx tests/blades-update.ts || BLADE_EXIT=$?
          node scripts/compare-blade-regressions.mjs "$RUNNER_TEMP/blades-before.json" docs/blades-update-results.json
          node -e 'require("node:fs").writeFileSync("docs/test-results.json", JSON.stringify({checks:[]}))'
          CRA_TEST_FILTER="200 isolated hits" node --import tsx tests/run.ts
          CRA_TEST_FILTER="Free-space momentum" node --import tsx tests/run.ts
          CRA_TEST_FILTER="Battery never increases" node --import tsx tests/run.ts
      - name: Prepare cloud Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2 --no-audit --no-fund
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser checks on the built game
        run: |
          node scripts/serve.mjs --port=4173 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node tests/sawblaze-browser.mjs
      - name: Publish the tested source
        run: |
          git status --short
          git diff --check
          git diff -- src tests/blades-update.ts
          git log --oneline -10
          git rm scripts/apply-sawblaze-assembly.mjs scripts/compare-blade-regressions.mjs .github/workflows/sawblaze-assembly.yml
          git add src tests/sawblaze-assembly.ts tests/sawblaze-browser.mjs tests/blades-update.ts
          git -c user.name=tjh87 -c user.email=2867835+tjh87@users.noreply.github.com commit -m "Align SawBlaze assembly and add speed-dependent blade exposure"
          git push origin HEAD:main
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sawblaze-assembly-evidence
          path: |
            browser-evidence/
            docs/roster-results.json
            docs/test-results.json
            docs/blades-update-results.json
          retention-days: 7
