name: Online release acceptance
on:
  push:
    branches: [online-four-digit-rooms]
    paths: ['.github/workflows/online-release.yml','scripts/online-release-fit.mjs','tests/online-capacity.ts']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: online-release-acceptance
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONLINE_REDIS_URL: ${{ secrets.ONLINE_REDIS_URL }}
      ONLINE_NAMESPACE: release-${{ github.run_id }}
      ONLINE_LOCAL_TEST: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply release corrections
        run: node scripts/online-release-fit.mjs
      - name: Authoritative rooms and concurrent simulation capacity
        run: |
          node node_modules/typescript/bin/tsc --project tsconfig.server.json --noEmit
          node --import tsx tests/online-core.ts
          timeout 90s node --import tsx tests/online-transport.ts
          timeout 120s node --import tsx tests/online-capacity.ts
          node scripts/build.mjs
          node scripts/verify.mjs
          node scripts/online-build.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-release-evidence
          path: browser-evidence
      - name: Commit tested release corrections
        run: |
          rm scripts/online-release-fit.mjs .github/workflows/online-release.yml
          git status --short
          git diff --check
          git diff server/gateway.ts server/engine.ts server/rooms.ts src/online/ui.ts
          git log --oneline -10
          git add server/gateway.ts server/engine.ts server/rooms.ts src/online/ui.ts scripts/online-release-fit.mjs .github/workflows/online-release.yml
          git -c user.name='tjh87' -c user.email='tjh87@users.noreply.github.com' commit -m 'Bound online room capacity and recover paused fights from checkpoints'
          git push origin HEAD:online-four-digit-rooms
