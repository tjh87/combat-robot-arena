name: Hydra drive fix validation
on:
  push:
    branches: [hydra-drive-fix]
    paths: ['.github/workflows/hydra-drive.yml','scripts/hydra-drive-fit.mjs','tests/hydra-drive.ts']
permissions:
  contents: write
concurrency:
  group: hydra-drive-fix
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply the focused drive fix
        run: |
          node scripts/hydra-drive-fit.mjs
          mkdir -p browser-evidence
      - name: Build, offline assets, and real movement
        run: |
          node scripts/build.mjs
          node scripts/verify.mjs
          node --import tsx tests/hydra-drive.ts
          node --import tsx tests/hydra-approved.ts
          node --import tsx tests/roster.ts > browser-evidence/roster.log 2>&1
      - name: Browser dependencies outside game
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Saved builds and WebGL
        run: |
          node scripts/serve.mjs > browser-evidence/server.log 2>&1 &
          node tests/hydra-browser.mjs
      - name: Update Hydra drive estimates
        run: |
          node --import tsx --input-type=module -e "import fs from 'node:fs';import{preset,compile}from'./src/model.ts';const path='handover/ROBOT_SPECIFICATIONS.json',data=JSON.parse(fs.readFileSync(path,'utf8')),c=preset(2),b=compile(c),row=data.robots.find(r=>r.profile==='hydra');Object.assign(row,{drive:c.drive,totalMassKg:b.mass});fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydra-drive-fix-evidence
          path: browser-evidence
      - name: Commit tested source to feature branch
        run: |
          rm scripts/hydra-drive-fit.mjs tests/hydra-drive-probe.ts .github/workflows/hydra-drive.yml
          git status --short
          git diff --check
          git diff src/model.ts src/sim.ts src/main.ts handover/ROBOT_SPECIFICATIONS.json
          git log --oneline -10
          git add src/model.ts src/sim.ts src/main.ts handover/ROBOT_SPECIFICATIONS.json tests/hydra-drive.ts scripts/hydra-drive-fit.mjs tests/hydra-drive-probe.ts .github/workflows/hydra-drive.yml
          git -c user.name='tjh87' -c user.email='tjh87@users.noreply.github.com' commit -m 'Fix Hydra speed and grounded steering control'
          git push origin HEAD:hydra-drive-fix
