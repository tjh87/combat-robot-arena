<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combat Robot Arena</title><meta name="description" content="Build your machine. Fight in a physical 3D robot arena. Play solo or local two-player."><link rel="icon" href="/favicon.svg"><style>
