name: Export accepted polished source
on:
  push:
    branches: [polished-menus-speed-damage]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Make sure that accepted inputs remain identical
        run: git diff --exit-code 71baee5898d3ca894c9f015985e1ee77111f8957 HEAD -- src tests scripts README.md docs
      - name: Export the same accepted source integration
        run: |
          node --input-type=module -e "import{readFileSync,writeFileSync}from'node:fs';const p='scripts/polish-fit.mjs';let s=readFileSync(p,'utf8');s=s.replace('cfg=this.latest!.configs[own]','cfg=this.sim!.bots[own].compiled.config').replace(\"crushPhase?:\\'closing\\'|\\'pressure\\'|\\'opening\\'\",'crushPhase?:string');writeFileSync(p,s);"
          node scripts/polish-fit.mjs
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs";const files=Object.fromEntries(["src/main.ts","src/weapon-gauge.ts","src/online/ui.ts","src/online/online.css","src/sim.ts","src/online/protocol.ts","server/frames.ts","src/online/replica.ts","tests/online-browser.mjs","README.md"].map(path=>[path,readFileSync(path,"utf8")]));writeFileSync("/tmp/polish-source.json",JSON.stringify({acceptedSource:"71baee5898d3ca894c9f015985e1ee77111f8957",acceptedRun:37310074532,files}));'
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-polish-source
          path: /tmp/polish-source.json
