name: Production builder and tournament acceptance
on:
  push:
    branches: [online-deployed-checks]
    paths: ['.github/workflows/online-production.yml']
permissions:
  contents: read
env:
  TESTED_SOURCE: 24f1054ff1b78b56075397eaa3337fcd3724dfba
  ARENA_URL: https://bbots-tjh87.vercel.app/
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24f1054ff1b78b56075397eaa3337fcd3724dfba
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the isolated protocol client fixture
        run: node tests/build-mode-fixture.mjs
      - name: Install isolated browser
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Prepare production tournament support clients
        run: |
          node --input-type=module <<'NODE'
          import{readFileSync,writeFileSync}from'node:fs';
          let source=readFileSync('tests/online-tournament-browser.mjs','utf8');
          source='import {readFile} from "node:fs/promises";\n'+source;
          source=source.replace("const base='http://127.0.0.1:4173/';","const base=process.env.ARENA_URL;const fixtureJS=await readFile('dist/mode-fixture.js','utf8'),fixtureHTML=await readFile('dist/mode-fixture.html','utf8');");
          source=source.replace('contexts.push(context);',"await context.route('**/mode-fixture.html',route=>route.fulfill({body:fixtureHTML,contentType:'text/html'}));await context.route('**/mode-fixture.js',route=>route.fulfill({body:fixtureJS,contentType:'text/javascript'}));contexts.push(context);");
          source=source.replace('const end=Date.now()+600000','const end=Date.now()+1800000');
          writeFileSync(process.env.RUNNER_TEMP+'/browser/tournament-production.mjs',source);
          NODE
      - name: Production templates, scratch recovery, fit, saves, and Practice
        run: node tests/mode-builder-browser.mjs
      - name: Seven physical production fights, repairs, spectator gauges, and champion
        run: node "$RUNNER_TEMP/browser/tournament-production.mjs"
      - name: Production armed contact, bubbles, ongoing control, rendering, and refresh
        run: node tests/online-impact-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-mode-builder-evidence
          path: browser-evidence
