name: Hydra drive diagnostics
on:
  push:
    branches: [hydra-drive-fix]
    paths: ['.github/workflows/hydra-drive.yml','tests/hydra-drive-probe.ts']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx tests/hydra-drive-probe.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydra-drive-probe
          path: browser-evidence
