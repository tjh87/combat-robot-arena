name: Online rooms and recovery foundation
on:
  push:
    branches: [online-four-digit-rooms]
    paths: ['.github/workflows/online-foundation.yml','server/**','src/online/**','scripts/online-*.mjs','tests/online-core.ts']
permissions:
  contents: write
concurrency:
  group: online-four-digit-rooms
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONLINE_REDIS_URL: ${{ secrets.ONLINE_REDIS_URL }}
      ONLINE_NAMESPACE: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add online dependencies without changing engine versions
        run: |
          node scripts/online-deps.mjs
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Apply owned-control and gateway changes
        run: |
          node scripts/online-migrate.mjs
          node scripts/online-harden.mjs
      - name: Types and real shared-state tests
        run: |
          node node_modules/typescript/bin/tsc --project tsconfig.server.json --noEmit
          node --import tsx tests/online-core.ts
          node scripts/build.mjs
          node scripts/verify.mjs
          node scripts/online-build.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-foundation-evidence
          path: browser-evidence
      - name: Commit tested foundation to the feature branch
        run: |
          rm scripts/online-migrate.mjs scripts/online-deps.mjs scripts/online-harden.mjs .github/workflows/online-foundation.yml
          git status --short
          git diff --check
          git diff src/model.ts src/sim.ts src/render.ts package.json scripts/build.mjs
          git log --oneline -10
          git add src/model.ts src/sim.ts src/render.ts server/store.ts server/gateway.ts package.json package-lock.json scripts/build.mjs scripts/online-migrate.mjs scripts/online-deps.mjs scripts/online-harden.mjs .github/workflows/online-foundation.yml
          git -c user.name='tjh87' -c user.email='tjh87@users.noreply.github.com' commit -m 'Establish four-digit online rooms and authoritative match recovery'
          git push origin HEAD:online-four-digit-rooms
