name: Hydra drive import compatibility
on:
  push:
    branches: [hydra-drive-fix]
    paths: ['.github/workflows/hydra-drive-import.yml','scripts/hydra-drive-import.mjs']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Retain the tested physical assemblies
        run: |
          mkdir -p browser-evidence
          node --import tsx --input-type=module -e "import fs from 'node:fs';import{preset,compile}from'./src/model.ts';fs.writeFileSync('browser-evidence/parts-before.json',JSON.stringify(Array.from({length:11},(_,i)=>compile(preset(i)).parts)));"
          node scripts/hydra-drive-import.mjs
      - name: Build, offline assets, imports, and movement
        run: |
          node scripts/build.mjs
          node scripts/verify.mjs
          node --import tsx tests/hydra-drive-import.ts
          node --import tsx tests/hydra-drive.ts
      - name: Update the drive compatibility tag
        run: |
          node --import tsx --input-type=module -e "import fs from 'node:fs';import{preset}from'./src/model.ts';const path='handover/ROBOT_SPECIFICATIONS.json',data=JSON.parse(fs.readFileSync(path,'utf8'));data.robots.find(r=>r.profile==='hydra').drive=preset(2).drive;fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydra-drive-import-evidence
          path: browser-evidence
      - name: Commit tested compatibility source
        run: |
          rm scripts/hydra-drive-import.mjs .github/workflows/hydra-drive-import.yml
          git status --short
          git diff --check
          git diff src/model.ts tests/hydra-drive.ts handover/ROBOT_SPECIFICATIONS.json
          git log --oneline -10
          git add src/model.ts tests/hydra-drive.ts tests/hydra-drive-import.ts handover/ROBOT_SPECIFICATIONS.json scripts/hydra-drive-import.mjs .github/workflows/hydra-drive-import.yml
          git -c user.name='tjh87' -c user.email='tjh87@users.noreply.github.com' commit -m 'Preserve custom Hydra gearing after the drive update'
          git push origin HEAD:hydra-drive-fix
